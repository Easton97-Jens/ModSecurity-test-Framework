version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # Routine Action releases are canonically updated as one validated Draft PR
    # by check-common-versions.yml. Zero suppresses only Dependabot version
    # updates; security updates remain an independent alert/review path.
    open-pull-requests-limit: 0
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
