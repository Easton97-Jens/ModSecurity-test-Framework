              HOME=/nonexistent \
              /usr/bin/unshare \
                --mount \
                --pid \
                --fork \
                --kill-child=SIGKILL \
                --mount-proc=/proc \
                --propagation private \
                /usr/bin/setpriv \
                  --reuid="$RUNTIME_UID" \
                  --regid="$RUNTIME_GID" \
                  --clear-groups \
                  --no-new-privs \
                  --inh-caps=-all \
                  --ambient-caps=-all \
                  --bounding-set=-all \
                  -- /usr/bin/env -i \
                    PATH=/usr/bin:/bin \
                    HOME=/nonexistent \
                    LANG=C \
                    LC_ALL=C \
                    TMPDIR="$expected_tmp_root" \
                    ALLOW_RUNTIME_BUILDS=1 \
                    ALLOW_RUNTIME_DOWNLOADS=1 \
                    CRS=with-crs \
                    MRTS=no-mrts \
                    RUNTIME_COMPONENT_TARGET=haproxy \
                    CRS_RUNTIME_RUN_ID="$TRUSTED_CRS_RUNTIME_RUN_ID" \
                    EXPECTED_PARENT_SHA="$RUNTIME_PARENT_SHA" \
                    EXPECTED_FRAMEWORK_SHA="$RUNTIME_FRAMEWORK_SHA" \
                    EXPECTED_MRTS_SHA="$RUNTIME_MRTS_SHA" \
                    EVIDENCE_ROOT='' \
                    PYTHONDONTWRITEBYTECODE=1 \
                    PYTHON="$SETUP_PYTHON_PATH" \
                    PYTHONPYCACHEPREFIX="$expected_pycache_root" \
                    GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
                    RUNNER_TEMP="$TRUSTED_RUNNER_TEMP" \
                    VERIFIED_RUN_ROOT="$expected_verified_root" \
                    BUILD_ROOT="$expected_build_root" \
                    SOURCE_ROOT="$expected_crs_source_root" \
                    CRS_SOURCE_DIR="$expected_crs_source_dir" \
                    TMP_ROOT="$expected_tmp_root" \
