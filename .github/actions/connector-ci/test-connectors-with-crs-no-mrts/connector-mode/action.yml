    - name: Project HAProxy runtime evidence
      id: project-haproxy-runtime-evidence
      if: fromJSON(inputs.caller-matrix).connector == 'haproxy' && steps.runtime.outcome == 'success'
      env:
        TRUSTED_SOURCE_ROOT: ${{ steps.prepare-haproxy-runtime-evidence.outputs.source_root }}
        TRUSTED_RUNNER_TEMP: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runner_temp }}
        TRUSTED_RUNNER_TEMP_IDENTITY: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runner_temp_identity }}
        TRUSTED_EVIDENCE_STAGE_ROOT: /tmp
        RUNTIME_UID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runtime_uid }}
        RUNTIME_GID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runtime_gid }}
        EVIDENCE_UID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.evidence_uid }}
        EVIDENCE_GID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.evidence_gid }}
        STAGE_PARENT: ${{ steps.prepare-haproxy-runtime-evidence.outputs.stage_parent }}
        PROJECTOR_SOURCE: ${{ steps.prepare-haproxy-runtime-evidence.outputs.projector_source }}
        PROJECTOR_BLOB: ${{ steps.prepare-haproxy-runtime-evidence.outputs.projector_blob }}
        PARENT_SHA: ${{ steps.prepare-haproxy-runtime-evidence.outputs.parent_sha }}
        FRAMEWORK_SHA: ${{ steps.prepare-haproxy-runtime-evidence.outputs.framework_sha }}
        MRTS_SHA: ${{ steps.prepare-haproxy-runtime-evidence.outputs.mrts_sha }}
        TRUSTED_CRS_RUNTIME_RUN_ID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runtime_run_id }}
      shell: bash -e {0}
      run: |
        set -euo pipefail
        require_sha() {
          case "$1" in ''|*[!0-9a-f]*) return 1 ;; esac
          test "${#1}" -eq 40
        }
        require_decimal() {
          case "$1" in ''|*[!0-9]*) return 1 ;; esac
          test "$1" -gt 0
        }
        require_sha "$PROJECTOR_BLOB"
        require_decimal "$RUNTIME_UID"
        require_decimal "$RUNTIME_GID"
        require_decimal "$EVIDENCE_UID"
        require_decimal "$EVIDENCE_GID"
        test "$RUNTIME_UID" -ne "$EVIDENCE_UID"
        test "$RUNTIME_GID" -ne "$EVIDENCE_GID"
        test "$(/usr/bin/stat -Lc '%d:%i:%u:%g:%a' -- "$TRUSTED_RUNNER_TEMP")" = "$TRUSTED_RUNNER_TEMP_IDENTITY"
        case "$TRUSTED_SOURCE_ROOT" in "$TRUSTED_RUNNER_TEMP"/*) ;; *) echo "FAIL: unsafe evidence source root" >&2; exit 2 ;; esac
        test "$TRUSTED_EVIDENCE_STAGE_ROOT" = /tmp
        test -d "$TRUSTED_EVIDENCE_STAGE_ROOT"
        test ! -L "$TRUSTED_EVIDENCE_STAGE_ROOT"
        test "$(/usr/bin/realpath -e -- "$TRUSTED_EVIDENCE_STAGE_ROOT")" = "$TRUSTED_EVIDENCE_STAGE_ROOT"
        test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$TRUSTED_EVIDENCE_STAGE_ROOT")" = 0:0:1777
        case "$STAGE_PARENT" in "$TRUSTED_EVIDENCE_STAGE_ROOT"/haproxy-runtime-evidence-parent.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;; *) echo "FAIL: unsafe evidence stage parent" >&2; exit 2 ;; esac
        test "$PROJECTOR_SOURCE" = "$STAGE_PARENT/verified-projector.py"
        test ! -L "$STAGE_PARENT"
        test ! -L "$PROJECTOR_SOURCE"
        test "$(/usr/bin/sudo -n /usr/bin/realpath -e -- "$STAGE_PARENT")" = "$STAGE_PARENT"
        test "$(/usr/bin/sudo -n /usr/bin/realpath -e -- "$PROJECTOR_SOURCE")" = "$PROJECTOR_SOURCE"
        test "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a' -- "$STAGE_PARENT")" = 0:0:700
        projector_source_size=$(/usr/bin/sudo -n /usr/bin/stat -Lc '%s' -- "$PROJECTOR_SOURCE")
        require_decimal "$projector_source_size"
        test "$projector_source_size" -le 131072
        test "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a:%h:%s' -- "$PROJECTOR_SOURCE")" = "0:0:444:1:$projector_source_size"
        run_runner_projector() {
          /usr/bin/sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            /usr/bin/unshare \
              --mount \
              --pid \
              --fork \
              --kill-child=SIGKILL \
              --mount-proc=/proc \
              --propagation private \
              /usr/bin/setpriv \
                --reuid="$RUNTIME_UID" \
                --regid="$RUNTIME_GID" \
                --clear-groups \
                --no-new-privs \
                --inh-caps=-all \
                --ambient-caps=-all \
                --bounding-set=-all \
                -- /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 \
            /usr/bin/python3 -I -c '
        import hashlib
        import subprocess
        import sys
        blob, workspace, *arguments = sys.argv[1:]
        try:
            source = subprocess.check_output(
                ["/usr/bin/git", "--no-replace-objects", "--no-pager", "-C", workspace, "cat-file", "blob", blob],
                env={
                    "PATH": "/usr/bin:/bin",
                    "HOME": "/nonexistent",
                    "GIT_CONFIG_NOSYSTEM": "1",
                    "GIT_CONFIG_GLOBAL": "/dev/null",
                    "GIT_CONFIG_SYSTEM": "/dev/null",
                    "GIT_OPTIONAL_LOCKS": "0",
                },
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            raise SystemExit(2)
        if not source or len(source) > 131072:
            raise SystemExit(2)
        if hashlib.sha1(b"blob " + str(len(source)).encode("ascii") + b"\0" + source).hexdigest() != blob:
            raise SystemExit(2)
        sys.argv = ["<verified-haproxy-evidence-projector>", *arguments]
        namespace = {"__name__": "__main__", "__file__": "<verified-git-blob>"}
        exec(compile(source, namespace["__file__"], "exec"), namespace)
        ' "$PROJECTOR_BLOB" "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" "$@"
        }
        run_evidence_projector() {
          /usr/bin/sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            /usr/bin/unshare \
              --mount \
              --pid \
              --fork \
              --kill-child=SIGKILL \
              --mount-proc=/proc \
              --propagation private \
              /usr/bin/setpriv \
                --reuid="$EVIDENCE_UID" \
                --regid="$EVIDENCE_GID" \
                --clear-groups \
                --no-new-privs \
                --inh-caps=-all \
                --ambient-caps=-all \
                --bounding-set=-all \
                -- /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            PROJECTOR_BLOB="$PROJECTOR_BLOB" \
            /usr/bin/python3 -I -c '
        import hashlib
        import os
        import stat
        import sys
        source_path, *arguments = sys.argv[1:]
        blob = os.environ["PROJECTOR_BLOB"]
        maximum_bytes = 131072
        def fail(label):
            print("FAIL: evidence-source-capsule-" + label, file=sys.stderr)
            raise SystemExit(2)
        try:
            descriptor = os.open(
                source_path,
                os.O_RDONLY | os.O_NOFOLLOW | getattr(os, "O_CLOEXEC", 0),
            )
        except OSError:
            fail("open")
        try:
            details = os.fstat(descriptor)
            if (
                not stat.S_ISREG(details.st_mode)
                or details.st_nlink != 1
                or details.st_uid != 0
                or details.st_gid != 0
                or stat.S_IMODE(details.st_mode) != 0o444
                or details.st_size <= 0
                or details.st_size > maximum_bytes
            ):
                fail("metadata")
            source = os.read(descriptor, maximum_bytes + 1)
            after = os.fstat(descriptor)
        except OSError:
            fail("read")
        finally:
            os.close(descriptor)
        if len(source) != details.st_size or len(source) > maximum_bytes or (
            details.st_dev,
            details.st_ino,
            details.st_size,
            details.st_mode,
            details.st_uid,
            details.st_gid,
            details.st_nlink,
        ) != (
            after.st_dev,
            after.st_ino,
            after.st_size,
            after.st_mode,
            after.st_uid,
            after.st_gid,
            after.st_nlink,
        ):
            fail("identity")
        if hashlib.sha1(b"blob " + str(len(source)).encode("ascii") + b"\0" + source).hexdigest() != blob:
            fail("hash")
        sys.argv = ["<verified-haproxy-evidence-projector>", *arguments]
        namespace = {"__name__": "__main__", "__file__": "<sealed-staged-source>"}
        try:
            exec(compile(source, namespace["__file__"], "exec"), namespace)
        except SystemExit as error:
            if error.code not in (None, 0):
                print("FAIL: evidence-projector-exit", file=sys.stderr)
            raise
        ' "$PROJECTOR_SOURCE" "$@"
        }
        test "$(/usr/bin/stat -Lc '%d:%i:%u:%g:%a' -- "$TRUSTED_RUNNER_TEMP")" = "$TRUSTED_RUNNER_TEMP_IDENTITY"
        stage_root="$STAGE_PARENT/package"
        test ! -e "$stage_root"
        test ! -L "$stage_root"
        /usr/bin/sudo -n /usr/bin/mkdir -m 0700 -- "$stage_root"
        /usr/bin/sudo -n /usr/bin/chown --no-dereference "$EVIDENCE_UID:$RUNTIME_GID" -- "$stage_root"
        /usr/bin/sudo -n /usr/bin/chmod 0755 -- "$STAGE_PARENT"
        test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$STAGE_PARENT")" = 0:0:755
        test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$stage_root")" = "$EVIDENCE_UID:$RUNTIME_GID:700"
        run_runner_projector export-source-receipt \
          --source-root "$TRUSTED_SOURCE_ROOT" \
          --runtime-uid "$RUNTIME_UID" \
          --expected-parent-sha "$PARENT_SHA" \
          --expected-framework-sha "$FRAMEWORK_SHA" \
          --expected-mrts-sha "$MRTS_SHA" \
          --expected-cell-run-id "$TRUSTED_CRS_RUNTIME_RUN_ID" \
          | /usr/bin/head --bytes=16385 \
          | run_evidence_projector project-document --source-document-stdin \
            --runner-temp "$TRUSTED_EVIDENCE_STAGE_ROOT" \
            --stage-parent "$STAGE_PARENT" \
            --stage-root "$stage_root" \
            --runtime-uid "$RUNTIME_UID" \
            --upload-gid "$RUNTIME_GID" \
            --expected-parent-sha "$PARENT_SHA" \
            --expected-framework-sha "$FRAMEWORK_SHA" \
            --expected-mrts-sha "$MRTS_SHA" \
            --expected-cell-run-id "$TRUSTED_CRS_RUNTIME_RUN_ID"
        printf '%s\n' "stage_root=$stage_root" >> "$GITHUB_OUTPUT"

