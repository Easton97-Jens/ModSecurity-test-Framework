    - name: Produce canonical with-CRS no-MRTS profile cell
      id: produce-profile-cell
      if: steps.runtime.outcome == 'success' && (fromJSON(inputs.caller-matrix).connector != 'haproxy' || steps.verify-haproxy-runtime-evidence.outcome == 'success') && (fromJSON(inputs.caller-matrix).connector != 'apache' || steps.validate-apache-runtime-evidence.outcome == 'success')
      env:
        SOURCE_ROOT: ${{ steps.prepare-crs-source.outputs.source_root || env.SOURCE_ROOT }}
        CRS_SOURCE_DIR: ${{ steps.prepare-crs-source.outputs.crs_source_dir || env.CRS_SOURCE_DIR }}
        CONNECTOR: ${{ fromJSON(inputs.caller-matrix).connector }}
        PARENT_SHA: ${{ github.event.pull_request.head.sha || fromJSON(inputs.caller-inputs).parent_sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || fromJSON(inputs.caller-inputs).base_sha }}
        FRAMEWORK_SHA: ${{ steps.verify-revisions.outputs.framework_sha }}
        MRTS_SHA: ${{ steps.verify-revisions.outputs.mrts_sha }}
        PROFILE_RUN_ID_VALUE: with-crs-no-mrts-${{ github.run_id }}-${{ github.run_attempt }}
        CELL_RUN_ID_VALUE: crs-${{ github.run_id }}-${{ github.run_attempt }}-${{ fromJSON(inputs.caller-matrix).connector }}
        VERIFIED_ROOT: ${{ env.VERIFIED_RUN_ROOT }}
        HAPROXY_STAGE_ROOT: ${{ steps.project-haproxy-runtime-evidence.outputs.stage_root }}
        HAPROXY_EVIDENCE_SHA256: ${{ steps.verify-haproxy-runtime-evidence.outputs.evidence_sha256 }}
        HAPROXY_MANIFEST_SHA256: ${{ steps.verify-haproxy-runtime-evidence.outputs.manifest_sha256 }}
        HAPROXY_EVIDENCE_UID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.evidence_uid }}
        HAPROXY_EVIDENCE_GID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.evidence_gid }}
      shell: bash -e {0}
      run: |
        set -euo pipefail
        test -n "$PARENT_SHA"; test -n "$BASE_SHA"
        test "${#PARENT_SHA}" -eq 40; test "${#BASE_SHA}" -eq 40
        test "${#FRAMEWORK_SHA}" -eq 40; test "${#MRTS_SHA}" -eq 40
        export CONNECTOR_ROOT="$GITHUB_WORKSPACE" REPO_ROOT="$GITHUB_WORKSPACE"
        . "$FRAMEWORK_ROOT/ci/lib/common.sh"
        crs_commit="$CRS_APPROVED_COMMIT"
        crs_rule_sha256="$CRS_RULE_FILE_SHA256"
        test "${#crs_commit}" -eq 40; test "${#crs_rule_sha256}" -eq 64
        haproxy_source_args=()
        case "$CONNECTOR" in
          apache)
            source_root="$VERIFIED_ROOT"
            crs_source_root="$CRS_SOURCE_DIR"
            ;;
          haproxy)
            source_root="$HAPROXY_STAGE_ROOT"
            crs_source_root="$CRS_SOURCE_DIR"
            test -n "$HAPROXY_EVIDENCE_SHA256"; test -n "$HAPROXY_MANIFEST_SHA256"
            test -n "$HAPROXY_EVIDENCE_UID"; test -n "$HAPROXY_EVIDENCE_GID"
            haproxy_source_args=(
              --haproxy-evidence-sha256 "$HAPROXY_EVIDENCE_SHA256"
              --haproxy-manifest-sha256 "$HAPROXY_MANIFEST_SHA256"
              --haproxy-evidence-uid "$HAPROXY_EVIDENCE_UID"
              --haproxy-evidence-gid "$HAPROXY_EVIDENCE_GID"
            )
            ;;
          envoy|lighttpd|traefik)
            source_root="$VERIFIED_ROOT"
            crs_source_root="$VERIFIED_ROOT/runs/$CONNECTOR/$CELL_RUN_ID_VALUE/crs-fresh-source/coreruleset"
            ;;
          *) echo "FAIL: unsupported profile connector" >&2; exit 2 ;;
        esac
        test -d "$source_root"; test ! -L "$source_root"
        test -d "$crs_source_root"; test ! -L "$crs_source_root"
        python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/runtime/lifecycle/with-crs-no-mrts-profile.py produce \
          --connector "$CONNECTOR" --cell-run-id "$CELL_RUN_ID_VALUE" \
          --profile-run-id "$PROFILE_RUN_ID_VALUE" --parent-sha "$PARENT_SHA" \
          --base-sha "$BASE_SHA" --github-run-id "${{ github.run_id }}" \
          --github-run-attempt "${{ github.run_attempt }}" \
          --framework-sha "$FRAMEWORK_SHA" --mrts-sha "$MRTS_SHA" \
          --crs-commit "$crs_commit" --crs-rule-sha256 "$crs_rule_sha256" \
          --crs-source-root "$crs_source_root" "${haproxy_source_args[@]}" \
          --verified-root "$VERIFIED_ROOT" --source-root "$source_root" \
          --output-dir "$VERIFIED_ROOT/profile-cell"

