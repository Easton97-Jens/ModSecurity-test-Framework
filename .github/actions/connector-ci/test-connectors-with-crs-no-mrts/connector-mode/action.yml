        )
        require_sha "$summary_blob"
        /usr/bin/env -i \
          PATH=/usr/bin:/bin \
          HOME=/nonexistent \
          GIT_CONFIG_NOSYSTEM=1 \
          GIT_CONFIG_GLOBAL=/dev/null \
          GIT_CONFIG_SYSTEM=/dev/null \
          GIT_OPTIONAL_LOCKS=0 \
          /usr/bin/git --no-replace-objects --no-pager -C "$summary_source_root" cat-file -e "${summary_blob}^{blob}"
        /usr/bin/sudo -n /usr/bin/env -i \
