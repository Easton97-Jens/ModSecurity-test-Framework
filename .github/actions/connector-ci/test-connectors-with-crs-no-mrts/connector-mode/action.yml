            after.st_dev,
            after.st_ino,
            after.st_size,
            after.st_mode,
            after.st_uid,
            after.st_gid,
            after.st_nlink,
        ):
            fail("identity")
        if hashlib.sha1(b"blob " + str(len(source)).encode("ascii") + b"\0" + source).hexdigest() != blob:
            fail("hash")
        sys.argv = ["<verified-haproxy-evidence-projector>", *arguments]
        namespace = {"__name__": "__main__", "__file__": "<sealed-staged-source>"}
        try:
            exec(compile(source, namespace["__file__"], "exec"), namespace)
        except SystemExit as error:
            if error.code not in (None, 0):
                print("FAIL: evidence-projector-exit", file=sys.stderr)
            raise
        ' "$PROJECTOR_SOURCE" "$@"
        }
        digest_report="$STAGE_PARENT/haproxy-runtime-evidence-digests.json"
        test ! -e "$digest_report"
        test ! -L "$digest_report"
        /usr/bin/sudo -n /usr/bin/install -m 0640 -o 0 -g "$RUNTIME_GID" /dev/null "$digest_report"
        test "$(/usr/bin/stat -Lc '%u:%g:%a:%s' -- "$digest_report")" = "0:$RUNTIME_GID:640:0"
        run_evidence_projector verify --runner-temp "$TRUSTED_EVIDENCE_STAGE_ROOT" --stage-parent "$STAGE_PARENT" --stage-root "$STAGE_ROOT" --runtime-uid "$RUNTIME_UID" --upload-gid "$RUNTIME_GID" --expected-parent-sha "$PARENT_SHA" --expected-framework-sha "$FRAMEWORK_SHA" --expected-mrts-sha "$MRTS_SHA" --expected-cell-run-id "$TRUSTED_CRS_RUNTIME_RUN_ID" \
          | /usr/bin/head --bytes=1025 \
          | /usr/bin/sudo -n /usr/bin/tee -- "$digest_report" >/dev/null
        /usr/bin/env -i \
          PATH=/usr/bin:/bin \
          HOME=/nonexistent \
          /usr/bin/python3 -I - "$digest_report" "$GITHUB_OUTPUT" "$RUNTIME_GID" <<'PY'
        import json
        import os
        import re
        import stat
        import sys

        report_path, output_path, expected_gid_text = sys.argv[1:]
        expected_gid = int(expected_gid_text)
        maximum_bytes = 1024
        expected_names = ("haproxy-runtime-evidence.json", "manifest.json")
        expected_fields = {"files", "record_type", "schema_version"}
        digest_fields = {"name", "sha256"}
        digest_pattern = re.compile(r"^[0-9a-f]{64}$", re.ASCII)

        def reject_duplicate_keys(pairs):
            value = {}
            for key, item in pairs:
                if key in value:
                    raise ValueError("duplicate key")
                value[key] = item
            return value

        descriptor = os.open(
            report_path,
            os.O_RDONLY | os.O_NOFOLLOW | getattr(os, "O_CLOEXEC", 0),
        )
        try:
            before = os.fstat(descriptor)
            if (
                not stat.S_ISREG(before.st_mode)
                or before.st_nlink != 1
                or before.st_uid != 0
                or before.st_gid != expected_gid
                or stat.S_IMODE(before.st_mode) != 0o640
                or before.st_size <= 0
                or before.st_size > maximum_bytes
            ):
                raise ValueError("unsafe digest report file")
            raw = os.read(descriptor, maximum_bytes + 1)
            after = os.fstat(descriptor)
        finally:
            os.close(descriptor)
        if len(raw) != before.st_size or len(raw) > maximum_bytes or (
            before.st_dev,
            before.st_ino,
            before.st_size,
            before.st_mode,
            before.st_uid,
            before.st_gid,
            before.st_nlink,
        ) != (
            after.st_dev,
            after.st_ino,
            after.st_size,
            after.st_mode,
            after.st_uid,
            after.st_gid,
            after.st_nlink,
        ):
            raise ValueError("raced digest report file")
        if not raw.endswith(b"\n") or b"\0" in raw:
            raise ValueError("unsafe digest report bytes")
        document = json.loads(raw.decode("utf-8"), object_pairs_hook=reject_duplicate_keys)
        canonical = (
            json.dumps(document, allow_nan=False, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
            + "\n"
        ).encode("utf-8")
        if raw != canonical or type(document) is not dict or set(document) != expected_fields:
            raise ValueError("noncanonical digest report")
        if (
            document["record_type"] != "haproxy_runtime_evidence_digests"
            or type(document["schema_version"]) is not int
            or document["schema_version"] != 1
        ):
            raise ValueError("unexpected digest report metadata")
        files = document["files"]
        if type(files) is not list or len(files) != len(expected_names):
            raise ValueError("unexpected digest report files")
        values = {}
        for expected_name, item in zip(expected_names, files):
            if type(item) is not dict or set(item) != digest_fields:
                raise ValueError("unexpected digest report entry")
            name = item["name"]
            digest = item["sha256"]
            if name != expected_name or type(digest) is not str or digest_pattern.fullmatch(digest) is None:
                raise ValueError("unsafe digest report entry")
            values[name] = digest
        with open(output_path, "a", encoding="ascii", newline="\n") as output:
            output.write("evidence_sha256=" + values[expected_names[0]] + "\n")
            output.write("manifest_sha256=" + values[expected_names[1]] + "\n")
        print("haproxy_runtime_evidence_sha256=" + values[expected_names[0]])
        print("haproxy_runtime_manifest_sha256=" + values[expected_names[1]])
        PY
        /usr/bin/sudo -n /usr/bin/rm -f -- "$digest_report"
        test ! -e "$digest_report"
        test ! -L "$digest_report"

    - name: Validate Apache runtime evidence
      id: validate-apache-runtime-evidence
