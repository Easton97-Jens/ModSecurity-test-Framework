                UPLOAD_EVIDENCE_OUTCOME="$UPLOAD_EVIDENCE_OUTCOME" \
                /usr/bin/python3 -I -c '
        import hashlib
        import subprocess
        import sys
        blob, workspace, *arguments = sys.argv[1:]
        try:
            source = subprocess.check_output(
                ["/usr/bin/git", "--no-replace-objects", "--no-pager", "-C", workspace, "cat-file", "blob", blob],
                env={
                    "PATH": "/usr/bin:/bin",
                    "HOME": "/nonexistent",
                    "GIT_CONFIG_NOSYSTEM": "1",
                    "GIT_CONFIG_GLOBAL": "/dev/null",
                    "GIT_CONFIG_SYSTEM": "/dev/null",
                    "GIT_OPTIONAL_LOCKS": "0",
                },
                stderr=subprocess.DEVNULL,
            )
        except subprocess.CalledProcessError:
            raise SystemExit(2)
        if not source or len(source) > 131072:
            raise SystemExit(2)
        if hashlib.sha1(b"blob " + str(len(source)).encode("ascii") + b"\0" + source).hexdigest() != blob:
            raise SystemExit(2)
        sys.argv = ["<verified-workflow-summary>", *arguments]
        namespace = {"__name__": "__main__", "__file__": "<verified-git-blob>"}
        exec(compile(source, namespace["__file__"], "exec"), namespace)
        ' "$summary_blob" "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --connector "$CONNECTOR"
