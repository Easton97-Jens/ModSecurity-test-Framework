            expected_runtime_root="$TRUSTED_RUNNER_TEMP/ModSecurity-conector-with-crs-no-mrts"
            expected_cell_parent="$expected_runtime_root/$RUNTIME_PARENT_SHA"
            expected_cell_root="$expected_cell_parent/$TRUSTED_CRS_RUNTIME_RUN_ID"
            expected_verified_root="$expected_cell_root/verified"
            expected_build_root="$expected_verified_root/build"
            expected_tmp_root="$expected_verified_root/tmp"
            expected_log_root="$expected_verified_root/logs"
            expected_cache_root="$expected_verified_root/cache-v2"
            expected_component_cache="$expected_cache_root/shared"
            expected_crs_source_root="$expected_verified_root/crs-fresh-source"
            expected_crs_source_dir="$expected_crs_source_root/coreruleset"
            expected_pycache_root="$TRUSTED_RUNNER_TEMP/python-pycache"
            for runtime_path in "$TRUSTED_RUNNER_TEMP" "$expected_runtime_root" "$expected_cell_parent" "$expected_cell_root" "$expected_verified_root"; do
              test -d "$runtime_path"
              test ! -L "$runtime_path"
              test "$(/usr/bin/realpath -e -- "$runtime_path")" = "$runtime_path"
            done
            test "$(/usr/bin/stat -Lc '%d:%i:%u:%g:%a' -- "$expected_cell_root")" = "$RUNTIME_CELL_ROOT_IDENTITY"
            test "$VERIFIED_RUN_ROOT" = "$expected_verified_root"
            test "$BUILD_ROOT" = "$expected_build_root"
            test "$TMP_ROOT" = "$expected_tmp_root"
            test "$LOG_ROOT" = "$expected_log_root"
            test "$CACHE_ROOT" = "$expected_cache_root"
            test "$CONNECTOR_COMPONENT_CACHE" = "$expected_component_cache"
            test "$SOURCE_ROOT" = "$expected_crs_source_root"
            test "$CRS_SOURCE_DIR" = "$expected_crs_source_dir"
            test "$PYTHONPYCACHEPREFIX" = "$expected_pycache_root"
            test -d "$expected_crs_source_root"
            test -d "$expected_crs_source_dir"
            test ! -e "$expected_tmp_root"
            test ! -L "$expected_tmp_root"
            /usr/bin/install -d -m 0700 -- "$expected_tmp_root"
            /usr/bin/chmod 0700 -- "$expected_verified_root" "$expected_tmp_root"
            test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$expected_verified_root")" = "$RUNTIME_UID:$RUNTIME_GID:700"
            test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$expected_tmp_root")" = "$RUNTIME_UID:$RUNTIME_GID:700"
            /usr/bin/sudo -n /usr/bin/env -i \
