name: test-common / common-structure
description: Framework-owned connector tests; Parent retains its job and check identity.
inputs:
  framework-revision:
    description: Exact Framework commit pinned by this caller
    required: true
runs:
  using: composite
  steps:
    - name: Validate the pinned Framework and explicit connector context
      uses: $/.github/actions/connector-context
      with:
        framework-revision: ${{ inputs.framework-revision }}
    - name: Setup python
      id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
        check-latest: false
    - name: Verify Python interpreter contract
      env:
        EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      shell: bash -e {0}
      run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
    - name: Install selected Apache native lifecycle prerequisites
      shell: bash -e {0}
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes build-essential apache2-dev libmodsecurity-dev
    - name: Initialize runner temp paths
      shell: bash -e {0}
      run: |
        set -eu
        verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
        {
          echo "VERIFIED_RUN_ROOT=$verified_root"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
          echo "SOURCE_ROOT=$verified_root/src"
          echo "BUILD_ROOT=$verified_root/build"
          echo "TMP_ROOT=$verified_root/tmp"
          echo "LOG_ROOT=$verified_root/logs"
          echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
          echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
        } >> "$GITHUB_ENV"
    - name: Check common scaffold
      shell: bash -e {0}
      run: |
        set -eu
        test -d modules/ModSecurity-test-Framework
        # Top-level tests/ is repo-owned for lightweight repository tooling tests.
        test -d modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_tests
        test -f common/include/msconnector/request.h
        test -f common/include/msconnector/response.h
        test -f common/include/msconnector/transaction.h
        test -f common/include/msconnector/capabilities.h
        test -f common/include/msconnector/logging.h
        test -f common/src/status.c
        test -f common/src/intervention.c
        test -f common/src/origin.c
        test -f common/src/capabilities.c
        test -f modules/ModSecurity-test-Framework/connector_suite/config/testing/import-status.json
        test -f modules/ModSecurity-test-Framework/docs/catalog-and-cases.md
        test -f modules/ModSecurity-test-Framework/docs/testing-and-evidence.md
        test -f docs/testing-and-evidence.md
        test ! -d connectors/apache/tests
        test ! -d connectors/nginx/tests
        test -f docs/architecture.md
        test -f docs/connectors/README.md
        test -f modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-common-helpers.sh
    - name: Run isolated security regressions
      env:
        TMPDIR: ${{ runner.temp }}/reported-findings-regressions
        PYTHONDONTWRITEBYTECODE: "1"
      shell: bash -e {0}
      run: |
        set -eu
        umask 077
        mkdir -p "$TMPDIR"
        command -v cc >/dev/null
        python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/tools/run-active-tests.py --group common
    - name: Lightweight framework checks
      shell: bash -e {0}
      run: |
        make setup-dev
        make quick-check
        make -n check-active-inventory
        make -n check-active-inventory
        make -n check-active-inventory
        make -n check-active-inventory
        make -n check-active-inventory
    - name: Execute productive HTTP and companion technical-error callers
      env:
        TMPDIR: ${{ runner.temp }}
        RUNNER_TEMP: ${{ runner.temp }}
      shell: bash -e {0}
      run: make check-i10-common-callers
