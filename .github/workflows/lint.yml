name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: framework-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scaffold-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Initialize runner temp paths
        run: |
          set -euo pipefail
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
          {
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "BUILD_ROOT=$verified_root/build"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-pycache"
          } >> "$GITHUB_ENV"

      - name: Install hash-locked CI dependency
        run: bash ci/tools/install-hash-locked-ci-dependencies.sh

      - name: Verify Connector inventory bindings and archive
        env:
          TEST_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/connector_suite
        run: |
          set -euo pipefail
          python3 -P connector_suite/modsecurity_connector_ci/tools/update-inventory-bindings.py --check
          python3 -P connector_suite/modsecurity_connector_ci/tools/update-test-archive.py --check

      - name: Run framework lint
        run: |
          set -euo pipefail
          ./ci/tools/safe-make.sh lint
