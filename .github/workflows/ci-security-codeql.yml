name: CodeQL analysis

on:
  push:
    branches:
      - master
  schedule:
    - cron: '19 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-trusted:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
          - c-cpp
    steps:
      - name: Checkout trusted Framework revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Initialize CodeQL for actual Framework languages
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: linked
          config: |
            paths-ignore:
              - tools/MRTS/**

      - name: Analyze bounded Framework source
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
          upload: always
