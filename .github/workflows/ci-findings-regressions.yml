name: Finding regressions (Framework)

on:
  pull_request:
    branches:
      - master
    paths:
      - "ci/provisioning/generate-mrts.sh"
      - "ci/provisioning/mrts_definition_guard.py"
      - "tests/security_regression/test_mrts_definition_guard.py"
      - "ci/tools/install-hash-locked-ci-dependencies.sh"
      - "requirements-ci.lock"
      - ".github/workflows/ci-findings-regressions.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: findings-regressions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mrts-b03-entrypoint-regression:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Install existing hash-locked CI dependencies
        env:
          TMPDIR: ${{ runner.temp }}/findings-regressions
          PIP_CACHE_DIR: ${{ runner.temp }}/findings-pip-cache
        run: |
          set -eu
          umask 077
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          bash ci/tools/install-hash-locked-ci-dependencies.sh
      - name: Run Framework launcher regression
        env:
          TMPDIR: ${{ runner.temp }}/findings-regressions
        run: |
          set -eu
          umask 077
          mkdir -p "$TMPDIR"
          python3 -m unittest discover -s tests/security_regression -p 'test_mrts_definition_guard.py' -v

  # Temporary read-only diagnosis; remove after the concrete issue is read.
  # No checkout, credentials, gate mutation or downloaded executable.
  sonar-pr-128-diagnostic:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 128 && github.repository == 'Easton97-Jens/ModSecurity-test-Framework'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the identified public Sonar issue
        run: |
          set -euo pipefail
          printf '%s\n' 'Original issue AaDsHe5ZOryZpzLd_yHy; this diagnostic is not a Quality Gate result.'
          curl --fail --silent --show-error --proto '=https' --max-time 30 --max-filesize 524288 \
            'https://sonarcloud.io/api/issues/search?componentKeys=Easton97-Jens_ModSecurity-test-Framework&pullRequest=128&issues=AaDsHe5ZOryZpzLd_yHy' \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); fields = ("key", "rule", "message", "component", "line", "textRange", "flows", "severity", "type", "status", "resolution"); print(json.dumps({"total": data.get("total"), "issues": [{key: row.get(key) for key in fields} for row in data.get("issues", [])]}, ensure_ascii=True))'
