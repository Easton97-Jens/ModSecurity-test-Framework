name: SonarQube security analysis

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sonarqube:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      FRAMEWORK_ROOT: ${{ github.workspace }}
      TEST_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/connector_suite
      CONNECTOR_REVISION: cfd5e49cada3fc793ef50993147e3796a0907443
      PYTHONSAFEPATH: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Initialize explicit Framework paths
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/framework-build" "$RUNNER_TEMP/framework-tmp" \
            "$RUNNER_TEMP/framework-output" "$RUNNER_TEMP/framework-state"
          {
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/framework-pycache"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/framework-state"
            echo "BUILD_ROOT=$RUNNER_TEMP/framework-build"
            echo "TMP_ROOT=$RUNNER_TEMP/framework-tmp"
            echo "TMPDIR=$RUNNER_TEMP/framework-tmp"
            echo "OUTPUT_ROOT=$RUNNER_TEMP/framework-output"
            echo "CONNECTOR_ROOT=$RUNNER_TEMP/framework-sonar-connector"
            echo "FRAMEWORK_REVISION=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Install native analysis prerequisites
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$VERSION_CODENAME" = resolute
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          test ! -L /usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          test ! -L /etc/apt/sources.list.d/framework-reviewed-ubuntu.sources
          sudo tee /etc/apt/sources.list.d/framework-reviewed-ubuntu.sources >/dev/null <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: resolute resolute-updates resolute-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: resolute-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          sudo chown root:root /etc/apt/sources.list.d/framework-reviewed-ubuntu.sources
          sudo chmod 0644 /etc/apt/sources.list.d/framework-reviewed-ubuntu.sources
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install --no-install-recommends --yes build-essential apache2-dev autoconf automake libtool pkg-config libpcre2-dev libyajl-dev libcurl4-openssl-dev libxml2-dev liblmdb-dev libssl-dev zlib1g-dev bison flex git

      - name: Materialize explicit Product analysis input
        run: |
          set -euo pipefail
          test ! -e "$CONNECTOR_ROOT"
          git -c credential.helper= clone --no-checkout --filter=blob:none \
            https://github.com/Easton97-Jens/ModSecurity-conector.git "$CONNECTOR_ROOT"
          git -C "$CONNECTOR_ROOT" -c credential.helper= fetch --no-tags origin "$CONNECTOR_REVISION"
          git -C "$CONNECTOR_ROOT" checkout --detach "$CONNECTOR_REVISION"
          test "$(git -C "$CONNECTOR_ROOT" rev-parse HEAD)" = "$CONNECTOR_REVISION"
          test -z "$(git -C "$CONNECTOR_ROOT" status --porcelain --untracked-files=all)"

      - name: Compile all Framework native sources for security analysis
        run: |
          set -euo pipefail
          sh ci/checks/analysis/prepare-sonar-sdk.sh
          sdk="$BUILD_ROOT/ModSecurity_V3_build"
          test -f "$sdk/headers/modsecurity/modsecurity.h"
          test -f "$sdk/src/.libs/libmodsecurity.so"
          MODSECURITY_INC="$sdk/headers" MODSECURITY_LIB="$sdk/src/.libs" \
            python3 ci/checks/analysis/prepare-sonar-nginx.py \
            --connector-root "$CONNECTOR_ROOT" --connector-revision "$CONNECTOR_REVISION" \
            --output "$RUNNER_TEMP/framework-sonar-nginx"
          nginx_source="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"])' \
            "$RUNNER_TEMP/framework-sonar-nginx/manifest.json")"
          python3 ci/checks/analysis/prepare-sonar-cfamily.py \
            --output "$RUNNER_TEMP/framework-sonar-native" \
            --sdk "$sdk" \
            --connector-root "$CONNECTOR_ROOT" --connector-revision "$CONNECTOR_REVISION" \
            --apache-include /usr/include/apache2 --apr-include /usr/include/apr-1.0 \
            --nginx-source "$nginx_source" --nginx-build "$nginx_source/objs"

      - name: Analyze maintained languages and wait for the Quality Gate
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/sonar-private@0f3889fd2f9d6f8d4fc6c3ec82d44f6859ed32f3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_USER_HOME: ${{ runner.temp }}/framework-sonar-cache
        with:
          scannerVersion: 8.2.0.6438
          owner-mode: framework
          upstream-action: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
          args: >-
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.working.directory=${{ runner.temp }}/framework-sonar-work
            -Dsonar.cfamily.compile-commands=${{ runner.temp }}/framework-sonar-native/compile_commands.json
