name: five-connectors-with-crs-no-mrts-contract

on:
  push:
    paths:
      - ".github/workflows/five-connectors-with-crs-no-mrts-contract.yml"
      - "ci/checks/catalog/five_connectors_with_crs_no_mrts.py"
      - "ci/tools/run-five-connectors-with-crs-no-mrts.py"
      - "ci/provisioning/fetch-crs.sh"
      - "ci/provisioning/crs-provenance.sh"
      - "ci/lib/common.sh"
      - "tests/ci_security/test_five_connector_with_crs_no_mrts_contract.py"
      - "tests/security_regression/test_crs_git_ref_provenance.py"
      - "tests/schemas/five-connectors-with-crs-no-mrts/**"
      - "tests/cases/security/crs/crs_sqli_anomaly_block.yaml"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/five-connectors-with-crs-no-mrts-contract.yml"
      - "ci/checks/catalog/five_connectors_with_crs_no_mrts.py"
      - "ci/tools/run-five-connectors-with-crs-no-mrts.py"
      - "ci/provisioning/fetch-crs.sh"
      - "ci/provisioning/crs-provenance.sh"
      - "ci/lib/common.sh"
      - "tests/ci_security/test_five_connector_with_crs_no_mrts_contract.py"
      - "tests/security_regression/test_crs_git_ref_provenance.py"
      - "tests/schemas/five-connectors-with-crs-no-mrts/**"
      - "tests/cases/security/crs/crs_sqli_anomaly_block.yaml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: framework-five-connectors-with-crs-no-mrts-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  portable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Validate portable closed contract
        run: |
          set -euo pipefail
          make test-five-connectors-with-crs-no-mrts-contract
          make test-crs-provenance-contract
