name: CI security Python quality

on:
  push:
    branches:
      - master
    paths:
      - "ci/checks/security/**"
      - "ci/checks/catalog/five_connectors_with_crs_no_mrts.py"
      - "ci/tools/run-five-connectors-with-crs-no-mrts.py"
      - "ci/checks/documentation/check-change-records.py"
      - "ci/tools/fetch-security-tool.py"
      - "ci/tools/update-python-version.py"
      - "ci/tools/update-workflow-tools.py"
      - "ci/tools/install-hash-locked-ci-dependencies.sh"
      - "ci/tools/install_hash_locked_ci_dependencies.py"
      - "ci/tools/sync-maintenance-test-views.py"
      - "ci/pyyaml-build-tools.lock.json"
      - "ci/lib/common.sh"
      - "ci/tooling/security-tools.lock.yml"
      - "tests/ci_security/**"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "requirements-ci.lock"
  pull_request:
    paths:
      - "ci/checks/security/**"
      - "ci/checks/catalog/five_connectors_with_crs_no_mrts.py"
      - "ci/tools/run-five-connectors-with-crs-no-mrts.py"
      - "ci/checks/documentation/check-change-records.py"
      - "ci/tools/fetch-security-tool.py"
      - "ci/tools/update-python-version.py"
      - "ci/tools/update-workflow-tools.py"
      - "ci/tools/install-hash-locked-ci-dependencies.sh"
      - "ci/tools/install_hash_locked_ci_dependencies.py"
      - "ci/tools/sync-maintenance-test-views.py"
      - "ci/pyyaml-build-tools.lock.json"
      - "ci/lib/common.sh"
      - "ci/tooling/security-tools.lock.yml"
      - "tests/ci_security/**"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "requirements-ci.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  python-ci-security-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Set up reviewed Node.js runtime for Pyright
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          check-latest: false

      - name: Install hash-locked CI dependency
        run: bash ci/tools/install-hash-locked-ci-dependencies.sh

      - name: Fetch checksum-verified Ruff and Pyright
        env:
          TOOLS_DIR: ${{ runner.temp }}/framework-ci-security-tools
        run: |
          set -euo pipefail
          python3 ci/tools/fetch-security-tool.py --lock ci/tooling/security-tools.lock.yml \
            --tool ruff --output-dir "$TOOLS_DIR"
          python3 ci/tools/fetch-security-tool.py --lock ci/tooling/security-tools.lock.yml \
            --tool pyright --output-dir "$TOOLS_DIR"

      - name: Run deterministic Ruff lint and format checks
        env:
          TOOLS_DIR: ${{ runner.temp }}/framework-ci-security-tools
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
        run: |
          set -euo pipefail
          "$TOOLS_DIR/ruff" check ci/checks/security/check-ci-security-contract.py \
            ci/checks/catalog/five_connectors_with_crs_no_mrts.py \
            ci/tools/run-five-connectors-with-crs-no-mrts.py \
            ci/checks/security/check-python-version.py \
            ci/checks/security/check-ci-security-evidence-contract.py \
            ci/checks/security/check-json-result.py \
            ci/checks/security/compare-osv-results.py \
            ci/checks/security/osv_report_schema.py \
            ci/checks/documentation/check-change-records.py \
            ci/tools/fetch-security-tool.py ci/tools/update-python-version.py \
            ci/tools/update-workflow-tools.py \
            ci/tools/install_hash_locked_ci_dependencies.py ci/tools/sync-maintenance-test-views.py tests/ci_security
          "$TOOLS_DIR/ruff" format --check ci/checks/security/check-ci-security-contract.py \
            ci/checks/catalog/five_connectors_with_crs_no_mrts.py \
            ci/tools/run-five-connectors-with-crs-no-mrts.py \
            ci/checks/security/check-python-version.py \
            ci/checks/security/check-ci-security-evidence-contract.py \
            ci/checks/security/check-json-result.py \
            ci/checks/security/compare-osv-results.py \
            ci/checks/security/osv_report_schema.py \
            ci/checks/documentation/check-change-records.py \
            ci/tools/fetch-security-tool.py ci/tools/update-python-version.py \
            ci/tools/update-workflow-tools.py \
            ci/tools/install_hash_locked_ci_dependencies.py ci/tools/sync-maintenance-test-views.py tests/ci_security

      - name: Run deterministic Pyright type analysis
        env:
          TOOLS_DIR: ${{ runner.temp }}/framework-ci-security-tools
        run: |
          set -euo pipefail
          node --version
          node "$TOOLS_DIR/pyright/index.js" --project pyrightconfig.json
