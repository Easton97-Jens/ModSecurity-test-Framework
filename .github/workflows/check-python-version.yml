name: Resolve reviewed CPython 3.14 updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: framework-python-version-maintenance-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      resolver_status: ${{ steps.resolve.outputs.status }}
      update_available: ${{ steps.resolve.outputs.update_available }}
      candidate: ${{ steps.resolve.outputs.candidate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Resolve latest published stable CPython 3.14 patch
        id: resolve
        run: |
          set -euo pipefail
          python3 ci/tools/update-python-version.py --check --write-github-output

  candidate-validate:
    needs: resolve
    if: ${{ needs.resolve.outputs.update_available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
    outputs:
      candidate_validated: ${{ steps.candidate-validation.outputs.candidate_validated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Initialize candidate runner temporary paths
        run: |
          set -euo pipefail
          {
            echo "BUILD_ROOT=$RUNNER_TEMP/framework-python-version-build"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/framework-python-version-pycache"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/framework-python-version-state"
          } >> "$GITHUB_ENV"

      - name: Independently validate and materialize the candidate
        run: |
          set -euo pipefail
          python3 ci/tools/update-python-version.py --check \
            --expected-candidate "$CANDIDATE" \
            --write-candidate-file

      - name: Set up candidate Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "${{ runner.temp }}/framework-python-3.14-candidate"
          check-latest: false

      - name: Verify candidate runtime and install hash-locked CI dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          expected = tuple(int(part) for part in os.environ["CANDIDATE"].split("."))
          if sys.version_info[:3] != expected:
              raise SystemExit(
                  f"candidate mismatch: expected {os.environ['CANDIDATE']}, got {sys.version}"
              )
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"candidate is not CPython 3.14: {sys.version}")
          PY
          python3 -VV
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r requirements-ci.lock
          python3 -m pip check

      - name: Validate candidate compatibility and contracts
        id: candidate-validation
        run: |
          set -euo pipefail
          python3 -m compileall -q ci tests
          python3 -m unittest \
            tests.ci_security.test_update_python_version \
            tests.ci_security.test_python_version_contract -v
          make test-ci-security-contract
          make check-github-actions-workflows
          make test-workflow-security-contract
          echo "candidate_validated=true" >> "$GITHUB_OUTPUT"

  publish:
    needs:
      - resolve
      - candidate-validate
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'Easton97-Jens/ModSecurity-test-Framework' &&
      github.ref == 'refs/heads/master' &&
      needs.resolve.outputs.update_available == 'true' &&
      needs.candidate-validate.outputs.candidate_validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: false

      - name: Install hash-locked CI dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r requirements-ci.lock
          python3 -m pip check

      - name: Verify CPython publisher GitHub App configuration
        env:
          WORKFLOW_UPDATER_APP_CLIENT_ID: ${{ vars.WORKFLOW_UPDATER_APP_CLIENT_ID }}
          WORKFLOW_UPDATER_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_UPDATER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_UPDATER_APP_CLIENT_ID" ]; then
            echo "::error::WORKFLOW_UPDATER_APP_CLIENT_ID repository variable is missing or empty" >&2
            exit 1
          fi
          if [ -z "$WORKFLOW_UPDATER_APP_PRIVATE_KEY" ]; then
            echo "::error::WORKFLOW_UPDATER_APP_PRIVATE_KEY repository secret is missing" >&2
            exit 1
          fi

      - name: Mint repository-limited CPython publisher App token
        id: publisher_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WORKFLOW_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Inspect matching CPython Draft maintenance pull request
        id: maintenance_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.publisher_app_token.outputs.token }}
          script: |
            const branch = "automation/update-framework-python-314";
            const title = "chore: update reviewed CPython 3.14";
            const marker = "<!-- framework-python-314-updater -->";
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            if (defaultBranch !== "master") {
              core.setFailed("the CPython maintenance publisher requires master as the default branch");
              return;
            }
            const references = await github.rest.git.listMatchingRefs({
              owner,
              repo,
              ref: "heads/" + branch,
            });
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              head: owner + ":" + branch,
              state: "open",
              per_page: 100,
            });
            if (references.data.length === 0) {
              if (pullRequests.length !== 0) {
                core.setFailed("a CPython maintenance pull request exists without its expected branch");
              }
              core.setOutput("existing", "false");
              return;
            }
            if (
              references.data.length !== 1 ||
              references.data[0].ref !== "refs/heads/" + branch ||
              pullRequests.length !== 1
            ) {
              core.setFailed("expected exactly one matching CPython maintenance branch and open pull request");
              return;
            }
            const pullRequest = pullRequests[0];
            if (
              !pullRequest.draft ||
              pullRequest.base.ref !== defaultBranch ||
              pullRequest.title !== title ||
              !pullRequest.body?.includes(marker)
            ) {
              core.setFailed("the existing CPython maintenance pull request is not the matching Draft updater PR");
              return;
            }
            core.setOutput("existing", "true");

      - name: Prepare the constrained CPython maintenance branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAINTENANCE_PR_EXISTS: ${{ steps.maintenance_pr.outputs.existing }}
          PUBLISH_TOKEN: ${{ steps.publisher_app_token.outputs.token }}
        run: |
          set -euo pipefail
          UPDATE_BRANCH="automation/update-framework-python-314"
          test "$DEFAULT_BRANCH" = "master"
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local credential.helper "!f() { echo username=x-access-token; echo password=\"\$PUBLISH_TOKEN\"; }; f"
          trap 'git config --local --unset-all credential.helper' EXIT
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          case "$MAINTENANCE_PR_EXISTS" in
            true)
              git fetch --no-tags origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
              git merge-base --is-ancestor "origin/$DEFAULT_BRANCH" "origin/$UPDATE_BRANCH"
              changed_paths="$(git diff --name-only "origin/$DEFAULT_BRANCH...origin/$UPDATE_BRANCH")"
              test "$changed_paths" = ".python-version"
              git diff --check "origin/$DEFAULT_BRANCH...origin/$UPDATE_BRANCH"
              git switch --create "$UPDATE_BRANCH" --track "origin/$UPDATE_BRANCH"
              ;;
            false)
              git switch --create "$UPDATE_BRANCH" "origin/$DEFAULT_BRANCH"
              ;;
            *)
              echo "CPython maintenance PR state is invalid" >&2
              exit 2
              ;;
          esac

      - name: Revalidate the reusable CPython Draft branch before modifying it
        if: steps.maintenance_pr.outputs.existing == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = "master"
          python3 ci/checks/security/check-python-version.py
          python3 ci/checks/security/check-ci-security-contract.py
          changed_paths="$(git diff --name-only "origin/$DEFAULT_BRANCH...HEAD")"
          test "$changed_paths" = ".python-version"
          git diff --check "origin/$DEFAULT_BRANCH...HEAD"

      - name: Independently revalidate and apply the candidate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = "master"
          python3 ci/tools/update-python-version.py --check --expected-candidate "$CANDIDATE"
          python3 ci/tools/update-python-version.py --update --expected-candidate "$CANDIDATE"
          python3 ci/checks/security/check-python-version.py
          python3 ci/checks/security/check-ci-security-contract.py
          changed_paths="$(git diff --name-only "origin/$DEFAULT_BRANCH")"
          test "$changed_paths" = ".python-version"
          git diff --check "origin/$DEFAULT_BRANCH"

      - name: Build Draft pull request body
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          printf '%s\n' \
            '<!-- framework-python-314-updater -->' \
            '## English' \
            '' \
            'This Draft pull request was generated only after a read-only CPython 3.14 candidate validation.' \
            '' \
            'The publisher independently re-resolved the official Python.org metadata and verified that only `.python-version` changed.' \
            '' \
            '## Deutsch' \
            '' \
            'Dieser Draft Pull Request wurde erst nach einer schreibgeschützten CPython-3.14-Kandidatenvalidierung erzeugt.' \
            '' \
            'Der Publisher hat die offiziellen Python.org-Metadaten unabhängig erneut aufgelöst und geprüft, dass sich nur `.python-version` änderte.' \
            > "$RUNNER_TEMP/framework-python-version-pr-body.md"

      - name: Create or update Draft pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.publisher_app_token.outputs.token }}
          commit-message: "chore: update reviewed CPython 3.14"
          title: "chore: update reviewed CPython 3.14"
          body-path: ${{ runner.temp }}/framework-python-version-pr-body.md
          branch: automation/update-framework-python-314
          delete-branch: false
          draft: true
          add-paths: |
            .python-version

  outcome:
    needs:
      - resolve
      - candidate-validate
      - publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RESOLVER_RESULT: ${{ needs.resolve.result }}
      CANDIDATE_RESULT: ${{ needs.candidate-validate.result }}
      PUBLISHER_RESULT: ${{ needs.publish.result }}
      RESOLVER_STATUS: ${{ needs.resolve.outputs.resolver_status }}
      UPDATE_AVAILABLE: ${{ needs.resolve.outputs.update_available }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate }}
      CANDIDATE_VALIDATED: ${{ needs.candidate-validate.outputs.candidate_validated }}
    steps:
      - name: Report explicit CPython maintenance outcome
        run: |
          set -euo pipefail
          if [ "$RESOLVER_RESULT" != success ]; then
            echo "::error::CPython resolver did not produce a recognized successful result" >&2
            exit 1
          fi
          case "$RESOLVER_STATUS:$UPDATE_AVAILABLE" in
            current:false)
              if [ -n "$CANDIDATE" ] || [ "$CANDIDATE_RESULT" != skipped ] || [ "$PUBLISHER_RESULT" != skipped ]; then
                echo "::error::CPython no-update result has an unexpected candidate or publisher state" >&2
                exit 1
              fi
              printf '%s\n' \
                '## CPython maintenance outcome' \
                '' \
                'No reviewed CPython 3.14 update is currently available.' \
                'No branch, commit, or pull request was created or modified.' \
                '' \
                'Derzeit ist keine geprüfte CPython-3.14-Aktualisierung verfügbar.' \
                'Es wurde kein Branch, Commit oder Pull Request erstellt oder verändert.' \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            update_available:true)
              if ! printf '%s\n' "$CANDIDATE" | grep -Eq '^3[.]14[.][0-9]+$' || [ "$CANDIDATE_RESULT" != success ] || [ "$CANDIDATE_VALIDATED" != true ] || [ "$PUBLISHER_RESULT" != success ]; then
                echo "::error::CPython update was not fully validated and published" >&2
                exit 1
              fi
              printf '%s\n' \
                '## CPython maintenance outcome' \
                '' \
                'A reviewed CPython 3.14 update was independently validated and published through the constrained maintenance path.' \
                'Maintenance branch: automation/update-framework-python-314. The matching Draft pull request was created or updated when a change remained.' \
                '' \
                'Eine geprüfte CPython-3.14-Aktualisierung wurde unabhängig validiert und über den eingeschränkten Wartungspfad veröffentlicht.' \
                'Wartungs-Branch: automation/update-framework-python-314. Der passende Draft Pull Request wurde erstellt oder aktualisiert, sofern eine Änderung verblieb.' \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::CPython resolver status or update_available output is missing or unexpected" >&2
              exit 1
              ;;
          esac
