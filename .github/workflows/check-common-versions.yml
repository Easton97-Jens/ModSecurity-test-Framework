name: Check common.sh versions

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Optional exact common-version component name to resolve"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: framework-common-version-maintenance-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # This is the single authoritative inventory pass.  The legacy checker below
  # remains as a compatibility report while consumers migrate to this plan;
  # it is deliberately never allowed to publish a candidate by itself.
  canonical-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      maintenance_outcome: ${{ steps.plan.outputs.maintenance_outcome }}
      safe_updates: ${{ steps.plan.outputs.safe_updates }}
      reviews: ${{ steps.plan.outputs.reviews }}
      fatal: ${{ steps.plan.outputs.fatal }}
    steps:
      - name: Checkout trusted default revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: false
      - name: Resolve mandatory global and selected runtime scopes
        id: plan
        env:
          REQUESTED_COMPONENT: ${{ inputs.component }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r requirements-ci.lock
          python3 -m pip check
          args=(--root . --check --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" --markdown "$RUNNER_TEMP/canonical-maintenance-plan.md")
          if [[ -n "$REQUESTED_COMPONENT" ]]; then args+=(--component "$REQUESTED_COMPONENT"); fi
          resolver_exit=0
          python3 ci/tools/resolve-canonical-maintenance.py "${args[@]}" || resolver_exit=$?
          test -s "$RUNNER_TEMP/canonical-maintenance-plan.json"
          test -s "$RUNNER_TEMP/canonical-maintenance-plan.md"
          cat "$RUNNER_TEMP/canonical-maintenance-plan.md" >> "$GITHUB_STEP_SUMMARY"
          if (( resolver_exit != 0 )); then
            exit "$resolver_exit"
          fi
          python3 - "$RUNNER_TEMP/canonical-maintenance-plan.json" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          plan_path, output_path = map(Path, sys.argv[1:])
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          digest = plan.get("plan_sha256")
          unsigned = dict(plan)
          unsigned.pop("plan_sha256", None)
          if not isinstance(digest, str) or hashlib.sha256(json.dumps(unsigned, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()).hexdigest() != digest:
              raise SystemExit("canonical maintenance plan digest is invalid")
          if plan.get("global_inventory_complete") is not True:
              raise SystemExit("Go-FTW, Albedo, or canonical CI pin inventory is incomplete")
          if plan.get("maintenance_outcome") == "fatal":
              raise SystemExit("canonical maintenance plan is fatal")
          results = plan.get("component_results", [])
          values = {
              "plan_sha256": digest,
              "maintenance_outcome": plan.get("maintenance_outcome", "fatal"),
              "safe_updates": str(len(plan.get("safe_updates", []))),
              "reviews": str(len(plan.get("manual_reviews", []))),
              "fatal": str(sum(item.get("status") in {"unknown", "blocked", "error"} for item in results if isinstance(item, dict))),
          }
          if values["maintenance_outcome"] == "fatal":
              raise SystemExit("canonical maintenance plan is fatal")
          with output_path.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY
      - name: Validate review issue reconciliation without writes
        run: |
          set -euo pipefail
          python3 ci/tools/reconcile-common-version-review-issues.py --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" --validate-only
      - name: Retain caller-bound canonical maintenance plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-maintenance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/canonical-maintenance-plan.json
            ${{ runner.temp }}/canonical-maintenance-plan.md
          retention-days: 1
          if-no-files-found: error

  reconcile-trusted:
    needs: canonical-maintenance
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: false
      - name: Download caller-bound canonical maintenance plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-maintenance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Validate caller-bound canonical maintenance plan
        env:
          PLAN_SHA256: ${{ needs.canonical-maintenance.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          python3 ci/tools/reconcile-common-version-review-issues.py \
            --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --validate-only
      - name: Require distinct review-issue App configuration
        env:
          ISSUE_APP_CLIENT_ID: ${{ vars.MAINTENANCE_ISSUE_APP_CLIENT_ID }}
          ISSUE_APP_PRIVATE_KEY: ${{ secrets.MAINTENANCE_ISSUE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$ISSUE_APP_CLIENT_ID" && -n "$ISSUE_APP_PRIVATE_KEY" ]] || { echo 'review-issue App configuration is required' >&2; exit 1; }
      - name: Mint repository-limited issue reconciler App token
        id: issue_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAINTENANCE_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
      - name: Reconcile review issues from caller-bound plan on trusted default branch
        env:
          PLAN_SHA256: ${{ needs.canonical-maintenance.outputs.plan_sha256 }}
          GITHUB_ACTIONS: "true"
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_APP_TOKEN: ${{ steps.issue_app_token.outputs.token }}
        run: |
          set -euo pipefail
          python3 ci/tools/reconcile-common-version-review-issues.py \
            --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --repository "${GITHUB_REPOSITORY}" \
            --apply \
            --trusted-default-branch \
            --token "$ISSUE_APP_TOKEN"

  candidate:
    needs: canonical-maintenance
    if: >-
      needs.canonical-maintenance.outputs.safe_updates != '0' &&
      (needs.canonical-maintenance.outputs.maintenance_outcome == 'safe_updates' ||
      needs.canonical-maintenance.outputs.maintenance_outcome == 'safe_updates_with_manual_review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
      workflow_tool_candidate_sha256: ${{ steps.workflow_tool_candidate.outputs.workflow_tool_candidate_sha256 }}
    steps:
      - name: Checkout trusted default revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Download caller-bound canonical maintenance plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-maintenance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Snapshot trusted workflow-tool validation inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r requirements-ci.lock
          python3 -m pip check
          python3 ci/tools/update-workflow-tools.py snapshot-validation-inputs \
            --root . \
            --output-dir "$RUNNER_TEMP/canonical-workflow-tool-base"
      - name: Validate and apply caller-bound canonical plan
        env:
          PLAN_SHA256: ${{ needs.canonical-maintenance.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          python3 ci/tools/reconcile-common-version-review-issues.py \
            --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --validate-only
          python3 ci/tools/resolve-canonical-maintenance.py --root . \
            --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" \
            --apply-safe-updates --expected-plan-sha256 "$PLAN_SHA256"
      - name: Validate generated workflow-tool candidate
        id: workflow_tool_candidate
        run: |
          set -euo pipefail
          python3 ci/tools/update-workflow-tools.py validate-canonical-generated-candidate \
            --root . \
            --base-root "$RUNNER_TEMP/canonical-workflow-tool-base" \
            --verify-tool-assets \
            --output-dir "$RUNNER_TEMP/canonical-workflow-tool-assets" \
            --validate-proposed-tree \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Validate candidate path policy and focused controls
        id: validate
        run: |
          set -euo pipefail
          allowed='^(.github/workflows/[^/]+\.yml|ci/lib/common\.sh|ci/provisioning/runtime-(components\.manifest|component-lock)\.json|ci/tooling/security-tools\.lock\.yml|\.python-version|requirements-ci\.lock|docs/(reference/variables|github-actions-workflow-security)(\.de)?\.md|tests/schemas/five-connectors-with-crs-no-mrts/(normalized-event|manifest|receipt)\.schema\.json|tests/cases/security/crs/crs_sqli_anomaly_block\.yaml)$'
          while IFS= read -r path; do [[ "$path" =~ $allowed ]] || { echo "unsafe candidate path: $path" >&2; exit 1; }; done < <(git diff --name-only)
          git diff --check
          bash -n ci/lib/common.sh
          python3 -m py_compile ci/tools/canonical_maintenance.py ci/tools/resolve-canonical-maintenance.py
          python3 -m unittest tests.ci_security.test_unified_common_maintenance_workflow tests.security_regression.test_common_version_descriptor_series tests.security_regression.test_runtime_component_lock -v
          printf 'validated=true\n' >> "$GITHUB_OUTPUT"

  publish:
    needs:
      - canonical-maintenance
      - candidate
      - reconcile-trusted
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'Easton97-Jens/ModSecurity-test-Framework' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.canonical-maintenance.outputs.safe_updates != '0' &&
      needs.candidate.result == 'success' &&
      (needs.reconcile-trusted.result == 'success' || needs.reconcile-trusted.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up reviewed Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Download caller-bound canonical maintenance plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-maintenance-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Snapshot trusted workflow-tool validation inputs
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r requirements-ci.lock
          python3 -m pip check
          python3 ci/tools/update-workflow-tools.py snapshot-validation-inputs \
            --root . \
            --output-dir "$RUNNER_TEMP/canonical-workflow-tool-base"
      - name: Validate and apply caller-bound canonical plan
        env:
          PLAN_SHA256: ${{ needs.canonical-maintenance.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          python3 ci/tools/reconcile-common-version-review-issues.py \
            --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --validate-only
          python3 ci/tools/resolve-canonical-maintenance.py --root . \
            --plan "$RUNNER_TEMP/canonical-maintenance-plan.json" \
            --apply-safe-updates --expected-plan-sha256 "$PLAN_SHA256"
          git diff --check
          plan_markdown="$RUNNER_TEMP/canonical-maintenance-plan.md"
          [[ -f "$plan_markdown" && ! -L "$plan_markdown" ]] || { echo 'canonical maintenance markdown artifact is invalid' >&2; exit 1; }
          grep -F -- "- Plan SHA-256: \`$PLAN_SHA256\`" "$plan_markdown" >/dev/null
          {
            printf '%s\n\n' '<!-- framework-canonical-maintenance -->' 'This Draft PR was created from a caller-bound canonical maintenance plan. No auto-merge is authorized.'
            cat "$plan_markdown"
          } > "$RUNNER_TEMP/common-maintenance-pr-body.md"
      - name: Revalidate generated workflow-tool candidate
        id: workflow_tool_candidate
        env:
          WORKFLOW_TOOL_CANDIDATE_SHA256: ${{ needs.candidate.outputs.workflow_tool_candidate_sha256 }}
        run: |
          set -euo pipefail
          python3 ci/tools/update-workflow-tools.py validate-canonical-generated-candidate \
            --root . \
            --base-root "$RUNNER_TEMP/canonical-workflow-tool-base" \
            --expected-candidate-sha256 "$WORKFLOW_TOOL_CANDIDATE_SHA256" \
            --verify-tool-assets \
            --output-dir "$RUNNER_TEMP/canonical-workflow-tool-assets" \
            --validate-proposed-tree \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Require publisher App configuration
        env:
          PUBLISHER_CLIENT_ID: ${{ vars.WORKFLOW_UPDATER_APP_CLIENT_ID }}
          PUBLISHER_PRIVATE_KEY: ${{ secrets.WORKFLOW_UPDATER_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$PUBLISHER_CLIENT_ID" && -n "$PUBLISHER_PRIVATE_KEY" ]] || { echo 'publisher App configuration is required' >&2; exit 1; }
      - name: Mint repository-limited publisher App token
        id: publisher_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WORKFLOW_UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_UPDATER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Inspect matching Draft canonical maintenance pull request
        id: maintenance_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.publisher_app_token.outputs.token }}
          script: |
            const branch = "automation/update-framework-common-versions";
            const title = "chore(ci): update canonical maintenance pins";
            const marker = "<!-- framework-canonical-maintenance -->";
            const allowedPaths = new Set([
              "ci/lib/common.sh",
              ".python-version",
              "requirements-ci.lock",
              "ci/tooling/security-tools.lock.yml",
              "ci/provisioning/runtime-components.manifest.json",
              "ci/provisioning/runtime-component-lock.json",
              "docs/reference/variables.md",
              "docs/reference/variables.de.md",
              "docs/github-actions-workflow-security.md",
              "docs/github-actions-workflow-security.de.md",
              ".github/workflows/check-action-versions.yml",
              ".github/workflows/check-common-versions.yml",
              ".github/workflows/check-python-version.yml",
              ".github/workflows/ci-security-codeql-pr.yml",
              ".github/workflows/ci-security-codeql.yml",
              ".github/workflows/ci-security-dependency-review.yml",
              ".github/workflows/ci-security-osv.yml",
              ".github/workflows/ci-security-quality.yml",
              ".github/workflows/ci-security-scorecard.yml",
              ".github/workflows/ci-security-secrets.yml",
              ".github/workflows/ci-security-workflow-lint.yml",
              ".github/workflows/cleanup-artifacts.yml",
              ".github/workflows/five-connectors-with-crs-no-mrts-contract.yml",
              ".github/workflows/lint.yml",
              ".github/workflows/test-common.yml",
              ".github/workflows/update-submodules.yml",
              "tests/schemas/five-connectors-with-crs-no-mrts/normalized-event.schema.json",
              "tests/schemas/five-connectors-with-crs-no-mrts/manifest.schema.json",
              "tests/schemas/five-connectors-with-crs-no-mrts/receipt.schema.json",
              "tests/cases/security/crs/crs_sqli_anomaly_block.yaml",
            ]);
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const references = await github.rest.git.listMatchingRefs({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: "open",
              per_page: 100,
            });
            if (references.data.length === 0) {
              if (pullRequests.length !== 0) {
                core.setFailed("a maintenance pull request exists without its expected branch");
              }
              core.setOutput("existing", "false");
              return;
            }
            if (
              references.data.length !== 1 ||
              references.data[0].ref !== `refs/heads/${branch}` ||
              pullRequests.length !== 1
            ) {
              core.setFailed("expected exactly one matching maintenance branch and open pull request");
              return;
            }
            const pullRequest = pullRequests[0];
            if (
              !pullRequest.draft ||
              pullRequest.base.ref !== defaultBranch ||
              pullRequest.title !== title ||
              !pullRequest.body?.includes(marker)
            ) {
              core.setFailed("the existing maintenance pull request is not the matching Draft updater PR");
              return;
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${defaultBranch}...${branch}`,
            });
            if (
              comparison.data.status !== "ahead" ||
              !Array.isArray(comparison.data.files) ||
              comparison.data.files.length > allowedPaths.size
            ) {
              core.setFailed("the existing maintenance branch is stale or cannot be scoped");
              return;
            }
            const unexpected = comparison.data.files
              .map((file) => file.filename)
              .filter((filename) => !allowedPaths.has(filename));
            if (unexpected.length !== 0) {
              core.setFailed(`the existing maintenance branch changes unallowlisted paths: ${unexpected.join(", ")}`);
              return;
            }
            core.setOutput("existing", "true");
      - name: Verify matching Draft canonical maintenance native workflow-tool subset
        if: steps.maintenance_pr.outputs.existing == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISHER_APP_TOKEN: ${{ steps.publisher_app_token.outputs.token }}
        run: |
          set -euo pipefail
          MAINTENANCE_BRANCH="automation/update-framework-common-versions"
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null
          git config --local credential.helper "!f() { echo username=x-access-token; echo password=\"\$PUBLISHER_APP_TOKEN\"; }; f"
          trap 'git config --local --unset-all credential.helper' EXIT
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
            "refs/heads/$MAINTENANCE_BRANCH:refs/remotes/origin/$MAINTENANCE_BRANCH"
          unset PUBLISHER_APP_TOKEN
          python3 ci/tools/update-workflow-tools.py \
            verify-existing-canonical-workflow-tool-subset \
            --root . \
            --base "origin/$DEFAULT_BRANCH" \
            --head "origin/$MAINTENANCE_BRANCH"
      - name: Create or update Draft PR from the full generated allowlist
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.publisher_app_token.outputs.token }}
          commit-message: "chore(ci): update canonical maintenance pins"
          title: "chore(ci): update canonical maintenance pins"
          body-path: ${{ runner.temp }}/common-maintenance-pr-body.md
          branch: automation/update-framework-common-versions
          base: ${{ github.event.repository.default_branch }}
          delete-branch: false
          draft: true
          add-paths: |
            ci/lib/common.sh
            .python-version
            requirements-ci.lock
            ci/tooling/security-tools.lock.yml
            ci/provisioning/runtime-components.manifest.json
            ci/provisioning/runtime-component-lock.json
            docs/reference/variables.md
            docs/reference/variables.de.md
            docs/github-actions-workflow-security.md
            docs/github-actions-workflow-security.de.md
            .github/workflows/check-action-versions.yml
            .github/workflows/check-common-versions.yml
            .github/workflows/check-python-version.yml
            .github/workflows/ci-security-codeql-pr.yml
            .github/workflows/ci-security-codeql.yml
            .github/workflows/ci-security-dependency-review.yml
            .github/workflows/ci-security-osv.yml
            .github/workflows/ci-security-quality.yml
            .github/workflows/ci-security-scorecard.yml
            .github/workflows/ci-security-secrets.yml
            .github/workflows/ci-security-workflow-lint.yml
            .github/workflows/cleanup-artifacts.yml
            .github/workflows/five-connectors-with-crs-no-mrts-contract.yml
            .github/workflows/lint.yml
            .github/workflows/test-common.yml
            .github/workflows/update-submodules.yml
            tests/schemas/five-connectors-with-crs-no-mrts/normalized-event.schema.json
            tests/schemas/five-connectors-with-crs-no-mrts/manifest.schema.json
            tests/schemas/five-connectors-with-crs-no-mrts/receipt.schema.json
            tests/cases/security/crs/crs_sqli_anomaly_block.yaml

  result:
    needs:
      - canonical-maintenance
      - candidate
      - reconcile-trusted
      - publish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize outcome, updates, reviews, issues, PR, and fatal findings
        env:
          RESOLVE: ${{ needs.canonical-maintenance.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          RECONCILE: ${{ needs.reconcile-trusted.result }}
          PUBLISH: ${{ needs.publish.result }}
          OUTCOME: ${{ needs.canonical-maintenance.outputs.maintenance_outcome }}
          UPDATES: ${{ needs.canonical-maintenance.outputs.safe_updates }}
          REVIEWS: ${{ needs.canonical-maintenance.outputs.reviews }}
          FATAL: ${{ needs.canonical-maintenance.outputs.fatal }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Common maintenance outcome / Ergebnis der gemeinsamen Wartung
          - Outcome / Ergebnis: "$OUTCOME"
          - Safe updates / Sichere Aktualisierungen: "$UPDATES"
          - Reviews / Prüfungen: "$REVIEWS"
          - Issues / Issues: reconciled by trusted job "$RECONCILE"
          - Draft PR: "$PUBLISH"
          - Fatal / Fatal: "$FATAL"
          - Jobs: resolve "$RESOLVE", candidate "$CANDIDATE"
          EOF
