SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain
SecRequestBodyLimit 1048576
SecResponseBodyLimit 1048576
SecRule REQUEST_HEADERS:X-Modsec-Smoke "@streq block" "id:1100001,phase:1,deny,status:403,log"
SecRule REQUEST_BODY "@contains no-crs-request-body-marker" "id:1100101,phase:2,deny,status:403,log"
SecRule RESPONSE_HEADERS:X-Modsec-Upstream "@streq block" "id:1100201,phase:3,deny,status:403,log"
SecRule RESPONSE_BODY "@contains no-crs-response-body-marker" "id:1100301,phase:4,deny,status:403,log"
