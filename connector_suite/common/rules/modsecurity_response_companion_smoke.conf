# Local Common response-companion host probe.  It exercises existing
# ModSecurity P1/P3/P4 rule phases through the shared transaction contract;
# it is not a CRS rule set or a production policy.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject
SecResponseBodyAccess On
SecResponseBodyLimitAction Reject
SecResponseBodyLimit 131072
SecResponseBodyMimeType text/plain

SecRule REQUEST_HEADERS:X-Modsec-Smoke "@streq block" "id:1000001,phase:1,deny,status:403,msg:'response companion P1 smoke deny'"
SecRule RESPONSE_HEADERS:X-Modsec-Upstream "@streq block" "id:1000003,phase:3,deny,status:403,msg:'response companion P3 smoke deny'"
SecRule RESPONSE_BODY "@contains no-crs-response-body-marker" "id:1000004,phase:4,deny,status:403,msg:'response companion P4 safe log-only smoke deny'"
