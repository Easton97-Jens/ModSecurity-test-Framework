# Shared connector-neutral P1-P4 vectors.
#
# These are targeted test inputs, not CRS and not runtime evidence.  Each
# marker is phase-specific so a vector cannot intentionally trigger another
# phase.  P4 Safe and P4 Strict use different markers; the host integration
# maps their requested outcomes to its documented post-commit mode.

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyLimitAction Reject
SecRequestBodyLimit 32
SecRequestBodyNoFilesLimit 32
SecRequestBodyLimitAction Reject
SecResponseBodyLimit 131072

# P1: request headers only.
SecRule REQUEST_HEADERS:X-Msconnector-Vector "@streq msconnector-p1-only" "id:1101001,phase:1,deny,status:403,log,msg:'shared P1-only vector'"

# P2: raw request body only.  Do not replace REQUEST_BODY with a query-string
# or URL variable: this rule is intentionally a body-phase contract.
SecRule REQUEST_BODY "@contains msconnector-p2-only" "id:1102001,phase:2,deny,status:403,log,msg:'shared P2-only vector'"
SecRule REQUEST_BODY "@contains msconnector-p2-client-abort" "id:1102002,phase:2,deny,status:403,log,msg:'shared P2 client-abort vector'"

# P3: upstream response headers only.
SecRule RESPONSE_HEADERS:X-Msconnector-Vector "@streq msconnector-p3-only" "id:1103001,phase:3,deny,status:403,log,msg:'shared P3-only vector'"
SecRule RESPONSE_HEADERS:X-Msconnector-Vector "@streq msconnector-p3-redirect" "id:1103002,phase:3,redirect:/msconnector-p3-redirect-target,status:302,log,msg:'shared P3 redirect vector'"

# P4: response body only.  Safe and Strict both request a disruptive rule
# action; the connector's selected host mode determines whether that request
# is translated to log-only forwarding or deterministic enforcement.
SecRule RESPONSE_BODY "@contains msconnector-p4-only" "id:1104001,phase:4,log,pass,msg:'shared P4-only vector'"
SecRule RESPONSE_BODY "@contains msconnector-p4-safe" "id:1104002,phase:4,log,deny,status:451,msg:'shared P4-safe vector; host mode safe translation'"
SecRule RESPONSE_BODY "@contains msconnector-p4-strict" "id:1104003,phase:4,log,deny,status:451,msg:'shared P4-strict vector; host mode strict'"
