name: apache_phase4_response_limit_reject
title: Apache native response inspection limit rejection control
category: apache-phase4-response
portable: false
connector: apache
status: pending
phase: 4
rules: |
  SecRuleEngine On
  SecResponseBodyAccess On
  SecResponseBodyLimit 8
  SecResponseBodyLimitAction Reject
  SecResponseBodyMimeType text/plain
request:
  method: GET
  path: /apache-phase4/limit-reject
response:
  body: body-exceeds-eight-byte-phase4-limit
  content_type: text/plain
expect:
  status: 500
  transport: http_status
  # libModSecurity Reject produces the native response limit intervention;
  # the host retains its established pre-commit failure handling.
  intervention: block
