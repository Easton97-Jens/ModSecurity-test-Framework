[run]
branch = True
relative_files = True
source = .
# Match independent repository and test ownership, never production-code gaps.
omit =
    modules/*
    tests/*
    **/test_*.py
    **/*_test.py
    .venv/*
    reports/*
patch = subprocess

[report]
show_missing = True
# Parent operational directories intentionally are not import packages. Keep
# their unexecuted files visible instead of reporting only modules imported by
# this selected assessment.
include_namespace_packages = True
