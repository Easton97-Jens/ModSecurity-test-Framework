# On-demand, synthetic protocol preparation fixture. No CRS or payload logs.
# Phase-1 selection is supplied as a separate rule only for deny scenarios.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain
SecRule RESPONSE_HEADERS:X-Modsec-Upstream "@streq block" \
    "id:1100201,phase:3,deny,status:403,log,t:none,msg:'protocol acceptance P3'"
SecRule RESPONSE_BODY "@contains no-crs-response-body-marker" \
    "id:1100301,phase:4,deny,status:403,log,t:none,msg:'protocol acceptance P4'"
