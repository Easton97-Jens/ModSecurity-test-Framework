name: phase4_body_reject
title: Native NGINX phase4 body reject
category: no-crs-full-lifecycle
portable: false
connector: nginx
status: future
runtime_materializable: false
no_crs_baseline: true
phase: 4
capabilities:
  response_body: true
  phase4: true
  intervention: true
rules: |
  SecRuleEngine On
  SecResponseBodyAccess On
  SecResponseBodyMimeType text/plain
  SecRule RESPONSE_BODY "@contains no-crs-response-body-marker" \
    "id:1100301,phase:4,deny,status:403,log,msg:'no-crs phase-4 intervention probe'"
  SecResponseBodyLimit 64
  SecResponseBodyLimitAction Reject
nginx:
  phase4_mode: safe
  location_directives: |
    modsecurity_phase4_log "@@NGINX_PHASE4_LOG@@";
request:
  method: GET
  path: /no-crs/full-lifecycle/phase4-body-reject
response:
  body: no-crs-response-body-markerxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  content_type: text/plain
expect: {}
full_lifecycle:
  requires_real_host_chunk_driver: true
  evidence_status: not_executed_until_real_host
  engine_response_body_limit: 64
  engine_response_body_limit_action: Reject
known_limitations:
  - Fixture generation does not prove native ingestion, Engine inspection length, or limit outcome.
  - Host status is not a successful Reject proof; exact native Engine failure and cleanup must be observed.
