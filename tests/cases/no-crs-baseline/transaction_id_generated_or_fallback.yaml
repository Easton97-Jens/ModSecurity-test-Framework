name: transaction_id_generated_or_fallback
title: Observe a host-generated transaction identifier for an independent request
category: no-crs-baseline
portable: true
status: pending
no_crs_baseline: true
phase: 1
required_capabilities:
  - transaction_id
  - phase1
capabilities:
  request_headers: true
  phase1: true
  logging: true
rules: |
  SecRuleEngine On
  SecAuditEngine On
  SecAuditLogType Serial
  SecAuditLogParts ABHZ
  SecAuditLog "@@AUDIT_LOG@@"
  SecAuditLogStorageDir "@@AUDIT_LOG_DIR@@"
  SecRule REQUEST_URI "@streq /no-crs/generated-transaction-id" \
      "id:1100502,phase:1,pass,log,t:none,msg:'no-crs generated transaction-id metadata'"
request:
  method: GET
  path: /no-crs/generated-transaction-id
expect:
  status: 200
  intervention: none
  rule_id: 1100502
  audit_log:
    required: true
    rule_id: 1100502
    message: no-crs generated transaction-id metadata
expected_result: allow_with_transaction_id
expected_status: 200
expected_rule_id: 1100502
expected_event_fields:
  - transaction_id
  - rule_id
  - phase
forbidden_event_fields:
  - request_body
  - response_body
connector_applicability: capability_driven
unsupported_behavior: UNSUPPORTED
