name: phase4_out_of_scope_content_type
title: Native Engine response MIME policy — phase4_out_of_scope_content_type
category: no-crs-baseline
portable: false
connector: nginx
status: pending
no_crs_baseline: true
phase: 4
capabilities:
  - response_body
  - phase4
rules: |
  SecRuleEngine On
  SecResponseBodyAccess On
  SecResponseBodyMimeType text/plain application/json
  SecAuditEngine On
  SecAuditLogType Serial
  SecAuditLogParts ABHZ
  SecAuditLog "@@AUDIT_LOG@@"
  SecAuditLogStorageDir "@@AUDIT_LOG_DIR@@"
nginx:
  location_directives: |
    types { }
    default_type "image/png";
    modsecurity_phase4_mode safe;
    modsecurity_phase4_log "@@NGINX_PHASE4_LOG@@";
request:
  method: GET
  path: /no-crs/content-type/phase4_out_of_scope_content_type
response:
  body: no-crs-response-body-marker
  content_type: "image/png"
expect:
  status: 200
  intervention: none
  rule_id: none
