[build-system]
requires = []
build-backend = "modsecurity_test_framework._build_backend"
backend-path = ["."]

[project]
name = "modsecurity-test-framework"
version = "1.0.0"
description = "Public, package-safe contracts for the ModSecurity test framework"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py314"
extend-exclude = ["tools/MRTS"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
