sonar.projectKey=Easton97-Jens_ModSecurity-test-Framework
sonar.organization=easton97-jens
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.scanner.autoconfig.enabled=false
sonar.scm.exclusions.disabled=true

# Keep maintained fixtures, runners, provisioning and workflow languages visible.
# Git internals are metadata; MRTS is independent; reports are generated evidence.
sonar.sources=.
sonar.tests=.
sonar.exclusions=.git/**,tools/MRTS/**,reports/**
sonar.test.exclusions=.git/**,tools/MRTS/**,reports/**
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*_test.go
sonar.python.version=3.14

# Explicit user decision: coverage is outside this security-analysis contract.
# Files remain analyzed for security, reliability and duplication.
sonar.coverage.exclusions=**
sonar.featureflag.cloud-security-enable-generic-yaml-and-json-analyzer=true
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
